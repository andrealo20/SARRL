[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarrl"
version = "0.6.0"
description = "Safe Adaptive Residual Reinforcement Learning for robotic manipulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Andrea Loroni"}]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["sarrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
