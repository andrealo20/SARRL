name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: python -m compileall -q sarrl tests tools
      - run: pytest

  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[mujoco]' pytest
      - run: pytest

  panda-replay:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[mujoco]' 'numpy==2.5.2' 'mujoco==3.13.0' pytest
      - run: pytest tests/test_panda_latency_diagnosis.py tests/test_panda_estimator_memory.py tests/test_panda_reference_validation.py
      - run: python -m tools.diagnose_panda_latency --output "$RUNNER_TEMP/panda-latency"
      - name: Audit retained parameter memory
        shell: bash
        run: |
          if [ -f results/panda_estimator_memory_pilot/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-memory-audit" cee94b2e0f8af416502fcd45c38c94e8b4234d0d
            cd "$RUNNER_TEMP/panda-memory-audit"
            python -m tools.audit_panda_estimator_memory --input "$GITHUB_WORKSPACE/results/panda_estimator_memory_pilot"
          fi
