name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest ruff
      - run: ruff check .
      - run: python -m compileall -q sarrl tests tools
      - run: pytest

  mujoco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[mujoco]' pytest
      - run: pytest

  panda-replay:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[mujoco]' 'numpy==2.5.2' 'mujoco==3.13.0' 'scipy==1.18.1' pytest
      - run: pytest tests/test_panda_latency_diagnosis.py tests/test_panda_estimator_memory.py tests/test_panda_reference_validation.py tests/test_panda_shared_scoring.py tests/test_panda_joint_filter.py tests/test_adaptive_margin_residual.py
      - run: python -m tools.diagnose_panda_latency --output "$RUNNER_TEMP/panda-latency"
      - name: Audit retained parameter memory
        shell: bash
        run: |
          if [ -f results/panda_estimator_memory_pilot/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-memory-audit" cee94b2e0f8af416502fcd45c38c94e8b4234d0d
            cd "$RUNNER_TEMP/panda-memory-audit"
            python -m tools.audit_panda_estimator_memory --input "$GITHUB_WORKSPACE/results/panda_estimator_memory_pilot"
          fi
      - name: Audit retained reference validation and profiling
        shell: bash
        run: |
          if [ -f results/panda_reference_validation/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-reference-audit" 09858a7368d89ff0cd82b920904d0231644d77f5
            cd "$RUNNER_TEMP/panda-reference-audit"
            python -m tools.audit_panda_reference_validation --input "$GITHUB_WORKSPACE/results/panda_reference_validation"
            python -m tools.profile_panda_reference --audit --input "$GITHUB_WORKSPACE/results/panda_reference_validation" --output "$GITHUB_WORKSPACE/results/panda_reference_profile"
          fi
      - name: Audit retained shared-parameter scoring
        shell: bash
        run: |
          if [ -f results/panda_shared_scoring_pilot/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-shared-audit" 1a47469c052c0f4dc2a14ff11e1a99839645bae7
            cd "$RUNNER_TEMP/panda-shared-audit"
            python -m tools.audit_panda_shared_scoring --input "$GITHUB_WORKSPACE/results/panda_shared_scoring_pilot"
          fi
      - name: Audit retained Panda joint filtering
        shell: bash
        run: |
          if [ -f results/panda_joint_filter_pilot/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-joint-audit" 6891dd27edf8b28514160d1ade350e3213826058
            cd "$RUNNER_TEMP/panda-joint-audit"
            python "$GITHUB_WORKSPACE/tools/audit_panda_joint_filter_portable.py" --source-checkout "$RUNNER_TEMP/panda-joint-audit" --input "$GITHUB_WORKSPACE/results/panda_joint_filter_pilot"
          fi
      - name: Audit retained planar residual statistics
        shell: bash
        run: |
          if [ -f results/planar_residual_v26/complete.json ]; then
            base_site=$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
            python -m venv "$RUNNER_TEMP/planar-statistics-env"
            stats_python="$RUNNER_TEMP/planar-statistics-env/bin/python"
            "$stats_python" -m pip install 'numpy==2.4.6'
            stats_site=$("$stats_python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
            printf '%s\n' "$base_site" > "$stats_site/reference-dependencies.pth"
            git worktree add --detach "$RUNNER_TEMP/planar-residual-audit" b41e167c2a609849c01031010e5710aa4801670f
            cd "$RUNNER_TEMP/planar-residual-audit"
            "$stats_python" -m tools.audit_planar_residual --input "$GITHUB_WORKSPACE/results/planar_residual_v26"
          fi
      - name: Audit retained control failure diagnosis
        shell: bash
        run: |
          if [ -f results/control_failure_diagnosis_v26/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/control-failure-audit" 2e88aa0c6284418859cf8ec37c7e25c4cfc5b81e
            cd "$RUNNER_TEMP/control-failure-audit"
            python -m tools.diagnose_control_failures --audit --output "$GITHUB_WORKSPACE/results/control_failure_diagnosis_v26"
          fi
      - name: Audit recovered Panda failure traces
        shell: bash
        run: |
          if [ -f results/panda_failure_replay_v26/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-failure-recovery-audit" f29dd979d3ef66d894a918935d252cb606dd73e7
            cd "$RUNNER_TEMP/panda-failure-recovery-audit"
            python -m tools.recover_panda_failures --source-checkout "$RUNNER_TEMP/panda-joint-audit" --output "$GITHUB_WORKSPACE/results/panda_failure_replay_v26" --audit
          fi
      - name: Audit retained Panda backup integration
        shell: bash
        run: |
          if [ -f results/panda_backup_integration_v26/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-backup-integration-audit" 9fa145b9cb1590b84b9db8749fba3332c7f39a0e
            cd "$RUNNER_TEMP/panda-backup-integration-audit"
            python -m tools.run_panda_backup_integration --source-checkout "$RUNNER_TEMP/panda-joint-audit" --output "$GITHUB_WORKSPACE/results/panda_backup_integration_v26" --audit
          fi
      - name: Audit retained Panda velocity discrepancy
        shell: bash
        run: |
          if [ -f results/panda_prediction_gap_v26/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-velocity-gap-audit" b66f3ba8ae6db4ba0ba07cfe989aa143a09f395b
            cd "$RUNNER_TEMP/panda-velocity-gap-audit"
            python -m tools.diagnose_panda_prediction_gap --audit --output "$GITHUB_WORKSPACE/results/panda_prediction_gap_v26"
          fi
      - name: Audit retained Panda position discrepancy
        shell: bash
        run: |
          if [ -f results/panda_prediction_gap_position_v26/complete.json ]; then
            git worktree add --detach "$RUNNER_TEMP/panda-position-gap-audit" e931139878240400bf2936c27d8621e0a5eefa29
            cd "$RUNNER_TEMP/panda-position-gap-audit"
            python -m tools.diagnose_panda_prediction_gap --audit --output "$GITHUB_WORKSPACE/results/panda_prediction_gap_position_v26"
          fi
